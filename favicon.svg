<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CedarStone Digital">
  <title>CedarStone Digital</title>
  <!-- Limestone ground -->
  <rect width="64" height="64" fill="#F2EEE6"/>
  <!-- Sheet edge -->
  <rect x="3" y="3" width="58" height="58" fill="none" stroke="#1F2628" stroke-width="3"/>
  <!-- Two exposed frames, top row -->
  <rect x="11" y="11" width="19" height="19" fill="#1F2628"/>
  <rect x="34" y="11" width="19" height="19" fill="#1F2628"/>
  <!-- Blank frame, bottom left -->
  <!-- The open frame, bottom right: outline only -->
  <rect x="34.5" y="34.5" width="18" height="18" fill="none" stroke="#1F2628" stroke-width="3"/>
</svg>
