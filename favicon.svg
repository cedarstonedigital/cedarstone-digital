<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Navy background square -->
  <rect width="64" height="64" fill="#1E3A8A"/>
  <!-- Diamond border -->
  <polygon points="32,3 61,32 32,61 3,32" fill="none" stroke="url(#g)" stroke-width="1.4"/>
  <!-- Cedar tree: 3 tiers -->
  <polygon points="32,11 27,22 37,22" fill="url(#g)" opacity=".95"/>
  <polygon points="32,18 20,33 44,33" fill="url(#g)" opacity=".85"/>
  <polygon points="32,27 13,46 51,46" fill="url(#g)" opacity=".78"/>
  <!-- Trunk -->
  <rect x="30" y="46" width="4" height="5" rx=".6" fill="#C8A55A" opacity=".9"/>
  <!-- Stone -->
  <path d="M22,51 L26,47 L32,46 L38,47 L42,51 L41,57 Q32,61 32,61 Q23,57 22,51 Z" fill="none" stroke="url(#g)" stroke-width=".9"/>
  <!-- Kintsugi crack highlight -->
  <path d="M26,47 Q30,53 26,59" stroke="#E2C98A" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".7"/>
  <defs>
    <linearGradient id="g" x1="3" y1="3" x2="61" y2="61" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2C98A"/>
      <stop offset="100%" stop-color="#C8A55A"/>
    </linearGradient>
  </defs>
</svg>
