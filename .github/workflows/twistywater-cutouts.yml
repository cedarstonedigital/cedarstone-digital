name: Cut out TwistyWater can and glass photos

on:
  workflow_dispatch:
  push:
    branches:
      - claude/sesotho-fashioning-file-d7d3dr
    paths:
      - .github/workflows/twistywater-cutouts.yml

permissions:
  contents: write

jobs:
  cutout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install rembg
        run: pip install "rembg[cpu]" pillow

      - name: Remove backgrounds (crop to product zone first, then segment)
        run: |
          python - <<'EOF'
          from rembg import remove, new_session
          from PIL import Image
          session = new_session("birefnet-general")
          # crop fractions x0,y0,x1,y1: product zone without headline, badges, side labels
          jobs = {
              "poster-lemon.jpg":    ("glass-lemon.png",    (0.150, 0.300, 0.885, 0.845)),
              "poster-mint.jpg":     ("glass-mint.png",     (0.145, 0.305, 0.875, 0.845)),
              "poster-rosemary.jpg": ("glass-rosemary.png", (0.155, 0.300, 0.880, 0.845)),
              "poster-cucumber.jpg": ("glass-cucumber.png", (0.150, 0.300, 0.880, 0.845)),
          }
          for src, (out, (x0, y0, x1, y1)) in jobs.items():
              im = Image.open(f"twistywater/assets/src-photos/{src}").convert("RGBA")
              W, H = im.size
              im = im.crop((int(W*x0), int(H*y0), int(W*x1), int(H*y1)))
              cut = remove(im, session=session)
              box = cut.getchannel("A").getbbox()
              cut = cut.crop(box)
              cut.save(f"twistywater/assets/{out}")
              print(out, cut.size)
          EOF

      - name: Commit and push
        run: |
          git config user.name "twistywater-assets-bot"
          git config user.email "actions@github.com"
          git add twistywater/assets
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "Cut out can and glass from poster photos"
          git push
