<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planet Jumping</title>
<link rel="icon" href="data:,">
<style>
/* ============================================================
   2. FONTS
   ============================================================ */
@font-face{
  font-family:'SF Pro';
  font-style:normal;
  font-weight:400;
  font-display:swap;
  src:local('SF Pro Text'),local('SF Pro Display'),local('SFProText-Regular'),local('SFProDisplay-Regular'),local('SF Pro');
}
@font-face{
  font-family:'SF Pro';
  font-style:normal;
  font-weight:700;
  font-display:swap;
  src:local('SF Pro Text Bold'),local('SF Pro Display Bold'),local('SFProText-Bold'),local('SFProDisplay-Bold');
}
@font-face{
  font-family:'SF Pro Thin';
  font-style:normal;
  font-weight:100;
  font-display:swap;
  src:local('SF Pro Display Thin'),local('SF Pro Text Thin'),local('SFProDisplay-Thin'),local('SFProDisplay-Ultralight');
}
@font-face{
  font-family:'Aalto';
  font-style:normal;
  font-weight:400;
  font-display:swap;
  src:local('Aalto'),local('Aalto Sans'),local('AaltoSans-Regular');
}

:root{
  font-family:'SF Pro',Arial,sans-serif;
  color:#fff;
  background:#090807;
  font-synthesis:none;
}

/* ============================================================
   5. LAYOUT CSS
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
.experience{position:relative;width:100%;height:100%;min-height:540px;overflow:hidden;background:#0a0908}
.backgrounds,.background,.shade,.transition-layer,.transition-layer video{position:absolute;inset:0;width:100%;height:100%}
.background{object-fit:cover;opacity:0;transition:opacity .8s ease}
.background.is-visible{opacity:1}
.shade{z-index:1;background:linear-gradient(to bottom,transparent 52%,rgba(0,0,0,.88) 100%);pointer-events:none}
.chrome{position:absolute;z-index:4;transition:opacity .45s ease,filter .45s ease}
.experience.is-transitioning .chrome{opacity:0;filter:blur(8px);pointer-events:none}

/* HEADER */
.header{left:clamp(18px,1.95vw,28px);right:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);display:flex;justify-content:space-between;align-items:center}
.header-actions{margin-left:auto;display:flex;align-items:center}
.nav{display:flex;align-items:center;height:42px;padding:4px 5px;border:1px solid rgba(255,255,255,.45);
     background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border-radius:999px}
.nav a{color:#fff;text-decoration:none;padding:8px 19px;border-radius:999px;line-height:1}
.nav a.active{background:#fff;color:#000}
.menu{height:42px;padding:0 20px;border:0;border-radius:999px;background:#fff;color:#000;cursor:pointer}

/* SIDEBAR */
.planet-list{left:clamp(18px,1.95vw,28px);top:50%;transform:translateY(-43%);display:flex;flex-direction:column;gap:6px;font-size:16px}
.planet-item{display:flex;align-items:center;min-height:20px}
.planet-item.active{font-size:18px;font-weight:700;gap:8px}
.planet-item.active:before{content:'';width:16px;height:16px;border-radius:50%;background:#fff}

/* PORTAL */
.portal-wrap{left:50%;top:50%;width:min(320px,31vw);transform:translate(-50%,-54%);perspective:none}
.portal-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:16px;opacity:0}
.portal-heading strong{font-size:18px;margin-left:8px}
.portal{position:relative;display:block;width:100%;aspect-ratio:320/350;padding:0;overflow:visible;border:0;
        border-radius:90px;background:transparent;cursor:pointer;box-shadow:none;transform:none!important}
.portal video,.portal img{visibility:hidden;position:absolute;width:1px;height:1px;pointer-events:none}
.portal-canvas{position:fixed;inset:0;z-index:3;width:100%;height:100%;pointer-events:none}

/* CONTENT */
.planet-content{left:clamp(28px,4vw,58px);right:clamp(28px,3vw,44px);bottom:clamp(24px,3vh,30px);
                display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.planet-content h1{font-family:Aalto,'Arial Narrow',sans-serif;font-size:clamp(128px,21.8vw,314px);
  font-weight:400;line-height:.72;margin:0 0 -.04em;letter-spacing:0;transform:translateX(-32px);opacity:0}
.planet-content dl{width:min(447px,34vw);margin:0;font-size:16px}
.fact{display:grid;grid-template-columns:138px 1fr;gap:18px;padding:8px 0;
      border-bottom:1px solid rgba(255,255,255,.48);opacity:0}
.fact:last-child{border-bottom:0}
.fact dt{font-weight:700}
.fact dd{margin:0}

/* MISC */
.transition-layer{display:none}
.scene-canvas{display:none}
.loading{position:absolute;z-index:12;left:50%;bottom:30px;transform:translateX(-50%);opacity:0;
         font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:opacity .2s}
.experience.is-loading .loading{opacity:.8}
.experience.is-transitioning .header,.experience.is-transitioning .planet-list{opacity:1;filter:none;pointer-events:auto}
.experience.is-transitioning .shade{opacity:1}
.experience.is-committing .background{transition:none!important}

/* ============================================================
   6. PRELOADER
   ============================================================ */
.preloader{position:absolute;inset:0;z-index:20;background:#000;overflow:hidden}
.preloader video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.preloader-shade{position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(to bottom,transparent,#000)}
.preloader.is-background{z-index:0}
.preloader.is-background .preloader-shade{opacity:0}
.floating-logo{position:fixed;z-index:22;left:50%;top:50%;width:59px;height:58px;transform:translate(-50%,-50%);
  will-change:left,top,width,height,transform;
  transition:left 2s cubic-bezier(.16,1,.3,1),top 2s cubic-bezier(.16,1,.3,1),width 2s cubic-bezier(.16,1,.3,1),height 2s cubic-bezier(.16,1,.3,1),transform 2s cubic-bezier(.16,1,.3,1)}
.floating-logo.is-docked{left:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);width:37px;height:36px;transform:none}
.floating-logo.is-settled{z-index:5}
.preloader-count{position:fixed;z-index:22;left:50%;bottom:clamp(22px,3.1vh,28px);display:flex;align-items:flex-end;
  gap:4px;transform:translateX(-50%);font-family:'SF Pro',Arial,sans-serif;line-height:1}
.preloader-count>span:first-child{font-family:'SF Pro Thin','SF Pro',Arial,sans-serif;font-size:64px;font-weight:100}
.preloader-count .percent{font-size:24px;padding-bottom:4px}
.preloader-count.is-leaving{animation:preload-count-out .75s cubic-bezier(.22,1,.36,1) both}
@keyframes preload-count-out{to{opacity:0;filter:blur(7px);transform:translate(-50%,-34px)}}
body:not(.preload-complete) .custom-cursor{opacity:0!important}

/* ============================================================
   9. CUSTOM CURSOR
   ============================================================ */
html,body,button,a,.portal{cursor:none!important}
.custom-cursor{display:block;position:fixed;left:0;top:0;z-index:100;width:1px;height:1px;
  pointer-events:none;opacity:0;transition:opacity .2s ease}
.custom-cursor.is-visible{opacity:1}
.cursor-dot,.cursor-orbit{position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%)}
.cursor-dot{width:12px;height:12px;background:#fff}
.cursor-orbit{width:36px;height:36px;border:1px solid #fff;background:rgba(255,255,255,.4);
  transition:transform .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-orbit{transform:translate(-50%,-50%) scale(1.16)}
.cursor-label{position:absolute;top:26px;left:0;transform:translateX(-50%) translateY(-4px);
  font:16px/1.2 'SF Pro',Arial,sans-serif;white-space:nowrap;opacity:0;
  transition:opacity .2s ease,transform .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-label{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============================================================
   10. ENTRANCE / SWITCH ANIMATIONS
   ============================================================ */
body:not(.intro-ready) .header,.planet-list,.planet-content h1,.planet-content .fact{opacity:0}
.intro-ready .header{animation:reveal-down .9s cubic-bezier(.22,1,.36,1) .1s both}
.intro-ready .planet-list{animation:reveal-side .9s cubic-bezier(.22,1,.36,1) .65s both}
.content-revealing h1{animation:title-rise 1.05s cubic-bezier(.16,1,.3,1) both}
.content-revealing .fact{animation:fact-rise .72s cubic-bezier(.22,1,.36,1) both}
.content-revealing .fact:nth-child(1){animation-delay:.52s}
.content-revealing .fact:nth-child(2){animation-delay:.68s}
.content-revealing .fact:nth-child(3){animation-delay:.84s}
.content-revealing .fact:nth-child(4){animation-delay:1s}
.mask-revealing .portal-heading{animation:portal-caption .85s cubic-bezier(.22,1,.36,1) both}
.planet-list.is-switching .planet-item{animation:menu-row .58s cubic-bezier(.22,1,.36,1) both}
.planet-list.is-switching .planet-item:nth-child(1){animation-delay:.02s}
.planet-list.is-switching .planet-item:nth-child(2){animation-delay:.05s}
.planet-list.is-switching .planet-item:nth-child(3){animation-delay:.08s}
.planet-list.is-switching .planet-item:nth-child(4){animation-delay:.11s}
.planet-list.is-switching .planet-item:nth-child(5){animation-delay:.14s}
.planet-list.is-switching .planet-item:nth-child(6){animation-delay:.17s}
.planet-list.is-switching .planet-item:nth-child(7){animation-delay:.2s}
.planet-list.is-switching .planet-item:nth-child(8){animation-delay:.23s}
.planet-list.is-switching .planet-item.active:before{animation:active-dot .55s cubic-bezier(.22,1,.36,1) .18s both}

@keyframes reveal-down   {from{opacity:0;filter:blur(8px);transform:translateY(-18px)}      to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes reveal-side   {from{opacity:0;filter:blur(8px);transform:translate(-20px,-43%)}  to{opacity:1;filter:blur(0);transform:translate(0,-43%)}}
@keyframes title-rise    {from{opacity:0;filter:blur(12px);transform:translate(-32px,42px)} to{opacity:1;filter:blur(0);transform:translate(-32px,0)}}
@keyframes fact-rise     {from{opacity:0;filter:blur(7px);transform:translateY(18px)}       to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes portal-caption{from{opacity:0;filter:blur(7px);transform:translateY(22px)}       to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes menu-row      {from{opacity:.35;transform:translateX(-8px)}                      to{opacity:1;transform:translateX(0)}}
@keyframes active-dot    {from{opacity:0;transform:scale(0)}                                to{opacity:1;transform:scale(1)}}

/* ============================================================
   11. RESPONSIVE
   ============================================================ */
@media(max-width:900px){
  .nav{display:none}
  .portal-wrap{width:min(300px,48vw)}
  .planet-content h1{font-size:clamp(105px,24vw,190px)}
  .planet-content dl{width:43vw}
  .fact{grid-template-columns:110px 1fr}
  .planet-list{font-size:14px}
  .planet-item.active{font-size:16px}
}
@media(max-width:640px){
  .experience{min-height:600px}
  .planet-list{display:none}
  .portal-wrap{top:44%;width:min(260px,66vw)}
  .planet-content{left:18px;right:18px;bottom:18px;display:block}
  .planet-content h1{font-size:clamp(98px,30vw,160px);margin-bottom:20px}
  .planet-content dl{width:100%;font-size:13px}
  .fact{grid-template-columns:92px 1fr;padding:5px 0}
  .portal-heading{font-size:14px}
  .portal-heading strong{font-size:16px}
  .menu{height:38px}
  .portal{border-radius:70px}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}.portal{transform:none!important}}
</style>
</head>
<body>
<main class="experience" data-planet="mars">
  <div class="backgrounds" aria-hidden="true">
    <video id="mars-background" class="background is-visible" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4" muted playsinline preload="auto"></video>
    <video id="earth-background" class="background" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto"></video>
    <video id="venus-background" class="background" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/b30f64d9-1637-477a-83df-d0fc6461a422.mp4" muted playsinline preload="auto"></video>
  </div>
  <div class="preloader" id="preloader" aria-label="Loading Mars">
    <video id="preloader-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4" muted playsinline preload="auto"></video>
    <div class="preloader-shade"></div>
  </div>
  <img class="floating-logo" id="floating-logo" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg" alt="Ubernatural">
  <div class="preloader-count" id="preloader-count" aria-live="polite">
    <span id="preloader-value">0</span><span class="percent">%</span>
  </div>
  <canvas id="scene-canvas" class="scene-canvas" aria-hidden="true"></canvas>
  <div class="shade" aria-hidden="true"></div>

  <header class="header chrome">
    <div class="header-actions">
      <nav class="nav" aria-label="Primary navigation">
        <a class="active" href="#about">About</a><a href="#explore">Explore</a><a href="#planets">Planets</a>
      </nav>
      <button class="menu" type="button">Menu</button>
    </div>
  </header>

  <aside class="planet-list chrome" aria-label="Planets"></aside>

  <canvas id="portal-canvas" class="portal-canvas" aria-hidden="true"></canvas>
  <section class="portal-wrap chrome" aria-label="Next destination">
    <div class="portal-heading">
      <span>Next:</span>
      <span><span id="next-number">[03]</span> <strong id="next-name">Earth</strong></span>
    </div>
    <button class="portal" id="portal" type="button" aria-label="Travel to Earth">
      <video id="portal-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto"></video>
      <img id="portal-image" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg" alt="Mercury">
    </button>
  </section>

  <section class="planet-content chrome" aria-live="polite">
    <h1 id="planet-title">MARS</h1>
    <dl id="facts"></dl>
  </section>

  <div class="transition-layer" aria-hidden="true"><video id="transition-video" muted playsinline preload="auto"></video></div>
  <div class="loading" aria-hidden="true">Preparing orbit&hellip;</div>
  <div class="custom-cursor" aria-hidden="true">
    <span class="cursor-orbit"></span><span class="cursor-dot"></span><span class="cursor-label">Enter</span>
  </div>
</main>

<script>
(function(){
'use strict';

/* ============================================================
   1. REMOTE ASSETS
   ============================================================ */
var BASE     = 'https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P';
var MARS_BG  = BASE + '/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4';
var TO_EARTH = BASE + '/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4';
var TO_VENUS = BASE + '/b30f64d9-1637-477a-83df-d0fc6461a422.mp4';
var TO_MARS  = BASE + '/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4';
var MERCURY  = BASE + '/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg';
var LOGO     = BASE + '/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg';

/* ============================================================
   ELEMENT HANDLES
   ============================================================ */
var experience     = document.querySelector('.experience');
var preloader      = document.getElementById('preloader');
var preloaderVideo = document.getElementById('preloader-video');
var preloaderCount = document.getElementById('preloader-count');
var preloaderValue = document.getElementById('preloader-value');
var floatingLogo   = document.getElementById('floating-logo');
var sceneCanvas    = document.getElementById('scene-canvas');
var portalCanvas   = document.getElementById('portal-canvas');
var portal         = document.getElementById('portal');
var portalVideo    = document.getElementById('portal-video');
var portalImage    = document.getElementById('portal-image');
var transitionVideo= document.getElementById('transition-video');
var planetTitle    = document.getElementById('planet-title');
var factsEl        = document.getElementById('facts');
var planetListEl   = document.querySelector('.planet-list');
var nextNumberEl   = document.getElementById('next-number');
var nextNameEl     = document.getElementById('next-name');
var cursorEl       = document.querySelector('.custom-cursor');

var pctx = portalCanvas.getContext('2d');
var sctx = sceneCanvas.getContext('2d');

/* ============================================================
   4. DATA MODEL
   ============================================================ */
var planets = ['Mercury','Venus','Earth','Mars','Jupiter','Saturn','Uranus','Neptune'];

var states = {
  mars: {
    name:'Mars', next:'Earth', number:'[03]', portal:TO_EARTH, background:'mars-background',
    facts:[
      ['Distance:','About 228 million km (1.5 astronomical units).'],
      ['Year:','One Martian year is equal to 687 Earth days.'],
      ['Temperature:','Around -60 °C, dropping to -125 °C at the poles in winter.'],
      ['Atmosphere:','Very thin, consisting of 95% carbon dioxide, with frequent dust storms.']
    ]
  },
  earth: {
    name:'Earth', next:'Venus', number:'[02]', portal:TO_VENUS, background:'earth-background',
    facts:[
      ['Distance:','149.6 million km from the Sun.'],
      ['Year:','365.25 Earth days.'],
      ['Temperature:','Average surface temperature around 15 °C.'],
      ['Atmosphere:','Mostly nitrogen and oxygen, supporting life and liquid water.']
    ]
  },
  venus: {
    name:'Venus', next:'Mercury', number:'[06]', image:MERCURY, background:'venus-background',
    facts:[
      ['Distance:','108.2 million km from the Sun.'],
      ['Year:','225 Earth days.'],
      ['Temperature:','Around 465 °C — the hottest planet in the Solar System.'],
      ['Atmosphere:','Extremely dense, mostly carbon dioxide, with clouds of sulfuric acid.']
    ]
  }
};

var current = 'mars';

/* ============================================================
   RUNTIME STATE
   ============================================================ */
var busy = false;
var transitionActive = false;
var expansion = 0;
var maskScale = 0;
var canvasOpacity = 1;
var rotX = 0, rotY = 0;
var targetX = 0, targetY = 0;
var frozen = false;
var hasRendered = false;

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  var s = states[current];

  experience.setAttribute('data-planet', current);
  planetTitle.textContent = s.name.toUpperCase();
  nextNameEl.textContent = s.next;
  nextNumberEl.textContent = s.number;
  portal.setAttribute('aria-label', 'Travel to ' + s.next);

  /* facts */
  while(factsEl.firstChild) factsEl.removeChild(factsEl.firstChild);
  for(var i = 0; i < s.facts.length; i++){
    var row = document.createElement('div');
    row.className = 'fact';
    var dt = document.createElement('dt');
    dt.textContent = s.facts[i][0];
    var dd = document.createElement('dd');
    dd.textContent = s.facts[i][1];
    row.appendChild(dt);
    row.appendChild(dd);
    factsEl.appendChild(row);
  }

  /* planet list */
  while(planetListEl.firstChild) planetListEl.removeChild(planetListEl.firstChild);
  for(var j = 0; j < planets.length; j++){
    var item = document.createElement('span');
    item.className = 'planet-item' + (planets[j] === s.name ? ' active' : '');
    item.textContent = planets[j];
    planetListEl.appendChild(item);
  }
  if(hasRendered){
    planetListEl.classList.remove('is-switching');
    void planetListEl.offsetWidth;
    planetListEl.classList.add('is-switching');
  }
  hasRendered = true;

  /* backgrounds */
  var bgs = document.querySelectorAll('.background');
  for(var k = 0; k < bgs.length; k++){
    if(bgs[k].id === s.background) bgs[k].classList.add('is-visible');
    else bgs[k].classList.remove('is-visible');
  }

  /* portal media */
  if(s.image){
    portalImage.style.display = '';
    portalVideo.style.display = 'none';
    if(portalImage.getAttribute('src') !== s.image) portalImage.setAttribute('src', s.image);
  }else{
    portalImage.style.display = 'none';
    portalVideo.style.display = '';
    if(portalVideo.getAttribute('src') !== s.portal){
      portalVideo.setAttribute('src', s.portal);
      portalVideo.load();
    }
    /* during the preloader the portal video must not compete for bandwidth;
       startExperience() starts it once the preloader has handed over */
    if(document.body.classList.contains('preload-complete')) playPortalVideo();
  }
}

function playPortalVideo(){
  portalVideo.loop = true;
  var p = portalVideo.play();
  if(p && p.catch) p.catch(function(){});
}

/* ============================================================
   7. CANVAS / PORTAL MASK
   ============================================================ */
function resizeCanvas(){
  var d = Math.min(window.devicePixelRatio || 1, 2);
  var w = window.innerWidth, h = window.innerHeight;

  portalCanvas.width = w * d;
  portalCanvas.height = h * d;
  portalCanvas.style.width = w + 'px';
  portalCanvas.style.height = h + 'px';
  pctx.setTransform(d, 0, 0, d, 0, 0);

  if(!frozen){
    sceneCanvas.width = w * d;
    sceneCanvas.height = h * d;
    sceneCanvas.style.width = w + 'px';
    sceneCanvas.style.height = h + 'px';
    sctx.setTransform(d, 0, 0, d, 0, 0);
  }
}

function drawCover(ctx, media){
  if(!media) return;
  var mw = media.videoWidth || media.naturalWidth || 0;
  var mh = media.videoHeight || media.naturalHeight || 0;
  if(!mw || !mh) return;
  var scale = Math.max(window.innerWidth / mw, window.innerHeight / mh);
  var w = mw * scale, h = mh * scale;
  try{
    ctx.drawImage(media, (window.innerWidth - w) / 2, (window.innerHeight - h) / 2, w, h);
  }catch(e){}
}

function drawShade(ctx){
  var H = window.innerHeight, W = window.innerWidth;
  var g = ctx.createLinearGradient(0, H * 0.52, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.88)');
  ctx.fillStyle = g;
  ctx.fillRect(0, H * 0.52, W, H * 0.48);
}

var CORNER_STEPS = 10;
function roundedRectPoints(w, h, r){
  r = Math.min(r, w / 2, h / 2);
  var pts = [];
  var corners = [
    [ w / 2 - r, -h / 2 + r, -Math.PI / 2, 0            ],
    [ w / 2 - r,  h / 2 - r,  0,            Math.PI / 2 ],
    [-w / 2 + r,  h / 2 - r,  Math.PI / 2,  Math.PI     ],
    [-w / 2 + r, -h / 2 + r,  Math.PI,      Math.PI * 1.5]
  ];
  for(var c = 0; c < corners.length; c++){
    var ox = corners[c][0], oy = corners[c][1], a0 = corners[c][2], a1 = corners[c][3];
    for(var i = 0; i <= CORNER_STEPS; i++){
      var a = a0 + (a1 - a0) * (i / CORNER_STEPS);
      pts.push([ox + Math.cos(a) * r, oy + Math.sin(a) * r]);
    }
  }
  return pts;
}

function project(x, y, rx, ry, cx, cy){
  var ax = rx * Math.PI / 180;
  var ay = ry * Math.PI / 180;
  var xx = x * Math.cos(ay);
  var yy = y * Math.cos(ax);
  var z = x * Math.sin(ay) - y * Math.sin(ax);
  var p = 850 / (850 + z);
  return [cx + xx * p, cy + yy * p];
}

var lastFrame = 0;
function draw(now){
  var dt = lastFrame ? Math.min(40, now - lastFrame) : 16;
  lastFrame = now;

  var k = Math.min(1, dt * 0.009);
  rotX += (targetX - rotX) * k;
  rotY += (targetY - rotY) * k;

  var W = window.innerWidth, H = window.innerHeight;
  pctx.clearRect(0, 0, W, H);

  if(frozen){
    pctx.drawImage(sceneCanvas, 0, 0, W, H);
    drawShade(pctx);
  }

  var rect = portal.getBoundingClientRect();
  var e = expansion;
  var rectCx = rect.left + rect.width / 2;
  var rectCy = rect.top + rect.height / 2;
  var cx = rectCx + (W / 2 - rectCx) * e;
  var cy = rectCy + (H / 2 - rectCy) * e;
  var baseW = rect.width + (W - rect.width) * e;
  var baseH = rect.height + (H - rect.height) * e;
  var scale = e ? 1 : maskScale;
  var w = baseW * scale;
  var h = baseH * scale;
  var r = 90 * (1 - e) * scale;
  var rx = rotX * (1 - e);
  var ry = rotY * (1 - e);

  if(w > 1 && h > 1){
    var pts = roundedRectPoints(w, h, r);
    pctx.save();
    pctx.globalAlpha = canvasOpacity;
    pctx.beginPath();
    for(var i = 0; i < pts.length; i++){
      var sp = project(pts[i][0], pts[i][1], rx, ry, cx, cy);
      if(i === 0) pctx.moveTo(sp[0], sp[1]);
      else pctx.lineTo(sp[0], sp[1]);
    }
    pctx.closePath();
    pctx.clip();
    pctx.fillStyle = '#030303';
    pctx.fillRect(0, 0, W, H);
    var media = transitionActive ? transitionVideo : (states[current].image ? portalImage : portalVideo);
    drawCover(pctx, media);
    if(transitionActive) drawShade(pctx);
    pctx.restore();
  }

  requestAnimationFrame(draw);
}

/* ============================================================
   POINTER TILT
   ============================================================ */
window.addEventListener('pointermove', function(ev){
  if(busy) return;
  targetY = (ev.clientX / window.innerWidth - 0.5) * 37.4;
  targetX = (ev.clientY / window.innerHeight - 0.5) * -33;
});
document.addEventListener('pointerleave', function(){
  targetX = 0;
  targetY = 0;
});

/* ============================================================
   8. TRAVEL TRANSITION
   ============================================================ */
function easeInOutCubic(t){
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function animateValue(setter, duration){
  return new Promise(function(resolve){
    var t0 = performance.now();
    function step(now){
      var p = Math.min(1, (now - t0) / duration);
      setter(easeInOutCubic(p));
      if(p < 1) requestAnimationFrame(step);
      else resolve();
    }
    requestAnimationFrame(step);
  });
}

function nextFrame(){
  return new Promise(function(resolve){ requestAnimationFrame(function(){ resolve(); }); });
}

function waitForEvent(el, events, timeout){
  return new Promise(function(resolve){
    var settled = false;
    var timer = null;
    function done(){
      if(settled) return;
      settled = true;
      if(timer !== null) clearTimeout(timer);
      for(var i = 0; i < events.length; i++) el.removeEventListener(events[i], done);
      resolve();
    }
    for(var i = 0; i < events.length; i++) el.addEventListener(events[i], done);
    if(typeof timeout === 'number') timer = setTimeout(done, timeout);
  });
}

function mediaLoadable(el){
  return new Promise(function(resolve){
    if(el.tagName === 'IMG'){
      if(el.complete && el.naturalWidth) return resolve();
      waitForEvent(el, ['load','error'], 4000).then(resolve);
      return;
    }
    if(el.readyState >= 2) return resolve();
    waitForEvent(el, ['loadeddata','canplay','canplaythrough','error'], 4000).then(resolve);
  });
}

function revealMask(){
  experience.classList.remove('mask-revealing');
  void experience.offsetWidth;
  experience.classList.add('mask-revealing');
  maskScale = 0;
  return animateValue(function(v){ maskScale = v; }, 1050);
}

function revealPlanetContent(){
  experience.classList.remove('content-revealing');
  void experience.offsetWidth;
  experience.classList.add('content-revealing');
}

function travel(){
  if(busy || current === 'venus') return Promise.resolve();
  busy = true;
  targetX = 0;
  targetY = 0;

  var next = current === 'mars' ? 'earth' : 'venus';

  return (function(){
    transitionVideo.src = states[current].portal;
    transitionVideo.load();
    experience.classList.add('is-loading');

    return waitForEvent(transitionVideo, ['canplaythrough','error'], 1600).then(function(){
      experience.classList.remove('is-loading');
      experience.classList.remove('content-revealing');
      experience.classList.remove('mask-revealing');
      experience.classList.add('is-transitioning');

      transitionVideo.currentTime = 0;
      transitionVideo.playbackRate = 1.3;
      canvasOpacity = 1;
      transitionActive = true;
      /* play() only settles once playback actually begins. On a starved stream
         it stays pending indefinitely (readyState 1, buffer never fills), which
         would strand the whole chain before any later guard is reached. Race it
         so the sequence always advances; a rejection still routes to .catch(). */
      var started = transitionVideo.play();
      if(!started || !started.then) return;
      return Promise.race([
        started,
        new Promise(function(res){ setTimeout(res, 2500); })
      ]);
    }).then(function(){
      return animateValue(function(v){ expansion = v; }, 1100);
    }).then(function(){
      /* on a starved frame budget the 1100ms expansion tween can outlast the clip,
         in which case 'ended' has already fired and there is no event left to wait
         for - without this guard the sequence would hang with the chrome hidden */
      if(transitionVideo.ended) return;
      /* A clip that starts but cannot keep streaming never fires 'ended' and
         never throws, which would strand the sequence in .is-transitioning
         with the chrome blurred out and busy stuck true. Bound the wait to the
         clip's own remaining runtime at 1.3x plus generous headroom, so a
         healthy transition is never cut short but a starved one still commits. */
      var remaining = (isFinite(transitionVideo.duration) && transitionVideo.duration > 0)
        ? ((transitionVideo.duration - transitionVideo.currentTime) / 1.3) * 1000
        : 0;
      return waitForEvent(transitionVideo, ['ended','error'], Math.min(15000, Math.max(4000, remaining + 3000)));
    }).then(function(){
      sctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      drawCover(sctx, transitionVideo);
      frozen = true;

      current = next;
      experience.classList.add('is-committing');
      render();
      return nextFrame();
    }).then(nextFrame).then(function(){
      transitionActive = false;
      expansion = 0;
      maskScale = 0;
      canvasOpacity = 1;
      experience.classList.remove('is-transitioning');
      experience.classList.remove('is-committing');

      var maskReveal = revealMask();
      setTimeout(revealPlanetContent, 100);
      return maskReveal;
    }).then(function(){
      setTimeout(function(){
        transitionVideo.removeAttribute('src');
        transitionVideo.load();
        busy = false;
      }, 450);
    }).catch(function(){
      transitionActive = false;
      expansion = 0;
      maskScale = 1;
      canvasOpacity = 1;
      experience.classList.remove('is-loading');
      experience.classList.remove('is-transitioning');
      experience.classList.remove('is-committing');
      busy = false;
    });
  })();
}

portal.addEventListener('click', function(){ travel(); });

/* ============================================================
   9. CUSTOM CURSOR (JS)
   ============================================================ */
var cursorX = 0, cursorY = 0, orbitX = 0, orbitY = 0, cursorSeen = false;

window.addEventListener('pointermove', function(ev){
  cursorX = ev.clientX;
  cursorY = ev.clientY;
  if(!cursorSeen){
    cursorSeen = true;
    orbitX = cursorX;
    orbitY = cursorY;
    cursorEl.classList.add('is-visible');
  }
});
document.addEventListener('mouseleave', function(){
  cursorEl.classList.remove('is-visible');
});
portal.addEventListener('pointerenter', function(){ cursorEl.classList.add('is-enter'); });
portal.addEventListener('pointerleave', function(){ cursorEl.classList.remove('is-enter'); });

function cursorLoop(){
  orbitX += (cursorX - orbitX) * 0.2;
  orbitY += (cursorY - orbitY) * 0.2;
  cursorEl.style.transform = 'translate3d(' + orbitX + 'px,' + orbitY + 'px,0)';
  requestAnimationFrame(cursorLoop);
}

/* ============================================================
   6. PRELOADER (JS)
   ============================================================ */
function startExperience(){
  var s = states[current];
  return mediaLoadable(s.image ? portalImage : portalVideo).then(function(){
    if(!states[current].image) playPortalVideo();
    return revealMask();
  }).then(function(){
    document.body.classList.add('intro-ready');
    setTimeout(revealPlanetContent, 850);
  });
}

function runPreloader(){
  var finished = false;
  var video = preloaderVideo;

  function finish(){
    if(finished) return;
    finished = true;
    preloaderValue.textContent = '100';
    preloaderCount.classList.add('is-leaving');
    floatingLogo.classList.add('is-docked');
    preloader.classList.add('is-background');
    document.body.classList.add('preload-complete');
    startExperience();
    setTimeout(function(){
      if(preloaderCount.parentNode) preloaderCount.parentNode.removeChild(preloaderCount);
    }, 750);
    setTimeout(function(){
      floatingLogo.classList.add('is-settled');
    }, 2000);
  }

  function begin(){
    if(video.duration && isFinite(video.duration)){
      video.playbackRate = Math.max(0.25, video.duration / 3);
    }
    var p = video.play();
    if(p && p.catch) p.catch(function(){ finish(); });
  }

  video.addEventListener('ended', finish);
  video.addEventListener('error', finish);

  /* Watchdog. Two ways this sequence can hang forever, neither of which fires
     'ended', 'error', or a rejected play():
       1. the CDN never returns metadata  -> readyState stays 0
       2. metadata arrives but the stream is too slow to play -> currentTime
          never advances while paused === false
     Either way the visitor sits on a black screen. Poll for real progress and
     release the experience if there is none. Long enough never to cut short
     media that is merely slow to start. */
  (function watchdog(){
    var lastTime = -1, stalledFor = 0, STEP = 1000, LIMIT = 9000;
    var timer = setInterval(function(){
      if(finished){ clearInterval(timer); return; }
      if(video.currentTime > lastTime + 0.01){ lastTime = video.currentTime; stalledFor = 0; }
      else stalledFor += STEP;
      if(stalledFor >= LIMIT){ clearInterval(timer); finish(); }
    }, STEP);
  })();

  if(video.readyState >= 1) begin();
  else video.addEventListener('loadedmetadata', begin, { once:true });

  function tick(){
    if(finished) return;
    if(video.duration && isFinite(video.duration) && video.duration > 0){
      preloaderValue.textContent = String(Math.round(video.currentTime / video.duration * 100));
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

window.addEventListener('resize', resizeCanvas);

/* ============================================================
   12. BOOT ORDER
   ============================================================ */
var backgroundVideos = document.querySelectorAll('.background');
for(var b = 0; b < backgroundVideos.length; b++){
  backgroundVideos[b].pause();
  try{ backgroundVideos[b].currentTime = 0; }catch(e){}
}
resizeCanvas();
render();
requestAnimationFrame(draw);
requestAnimationFrame(cursorLoop);
runPreloader();

})();
</script>
