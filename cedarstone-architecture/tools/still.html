<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Cedarstone — offline still renderer</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { createArchScene } from '../assets/js/scene.js';
const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const scene = createArchScene(canvas, { quality: 'still' });
if (q.has('cam')) scene.setCamera(JSON.parse(q.get('cam')));
scene.setProgress(parseFloat(q.get('p') || '0'));
scene.resize();
let n = 0;
(function tick() {
  scene.renderOnce(1 / 60);
  if (++n < 8) requestAnimationFrame(tick);
  else document.body.dataset.ready = '1';
})();
window.grab = (type = 'image/webp', q2 = 0.86) => canvas.toDataURL(type, q2);
</script>
</body>
</html>
